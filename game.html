<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>精灵召唤师 · 水母生态陪伴</title><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;background:#15151d;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#fff5df}.shell{position:relative;width:min(960px,100vw);aspect-ratio:3/2;border:4px solid #111;background:#222;box-shadow:0 20px 80px rgba(0,0,0,.5);overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;left:18px;top:18px;width:min(460px,calc(100% - 36px));padding:14px 16px;background:rgba(0,0,0,.55);border:2px solid rgba(255,208,96,.65)}.hud h1{font-size:18px;color:#ffd060;margin-bottom:8px}.hud p{font-size:13px;line-height:1.7}.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,20,24,.76);border:2px solid rgba(255,208,96,.75);padding:6px 14px;font-size:13px;white-space:nowrap;border-radius:4px}.diary{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,90%);padding:24px;border:4px solid #1a1a1a;background:linear-gradient(135deg,#8b5a2b,#a86f3a);box-shadow:0 16px 40px rgba(0,0,0,.45);display:none;z-index:2}.diary.open{display:block}.diary h2{color:#ffd060;font-size:26px;text-shadow:2px 2px 0 #1a1a1a;margin-bottom:16px}textarea{width:100%;height:140px;resize:none;padding:14px;border:3px solid #1a1a1a;background:#fff5e0;color:#2b241c;font-size:18px;outline:none;font-family:inherit}.actions{display:flex;gap:12px;margin-top:16px}button{border:3px solid #1a1a1a;background:#ffd060;color:#1a1a1a;padding:10px 18px;font-weight:800;cursor:pointer;font-size:16px}.back{position:fixed;left:18px;top:18px;color:#ffd060;text-decoration:none;font-weight:800}</style></head><body><a class="back" href="index.html">返回主页</a><div class="shell"><canvas id="game" width="960" height="640"></canvas><div class="hud"><h1>精灵召唤师 · 紫金港主图</h1><p id="state">WASD 移动，空格呼唤精灵，M 切换昼夜/雨天，靠近长椅按 E 写下心情。</p></div><div class="diary" id="diary"><h2>📖 主图书馆前的长椅</h2><textarea id="text" placeholder="写下此刻的心情… 它会改变周围的空气与精灵的心绪。"></textarea><div class="actions"><button id="save">写下合上 ✨</button><button id="close">起身离开</button></div></div><div class="hint" id="hint">WASD移动 | 空格呼唤精灵 | M切换天气 | E写日记</div></div><script>const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;const keys={},pal={warm:['#FFE7B8','#78A957','#62AAB5','#EDE4D4','#8B7565','#1A1A1A','主图前的长椅，让心事慢慢融化。'],rain:['#5B6775','#55794F','#466F7D','#C8C0D8','#675D78','#FFF5E0','雨落在启真湖上，像把今天轻轻折起来。'],night:['#18182B','#2E4A25','#233158','#C8C0D8','#675D78','#FFF5E0','主图的灯还亮着，像有人替你守夜。']};let mood='warm',t=0,quote='',qt=0,paused=false;const player={x:480,y:345,vx:0,vy:0},spirit={x:560,y:360,bond:.55,joy:.35,phase:Math.random()*6.28},bench={x:455,y:430};function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function setMood(m){mood=m;quote=pal[m][6];qt=260}function drawBuilding(p){x.fillStyle='rgba(0,0,0,.22)';x.fillRect(168,92,628,190);x.fillStyle=p[3];x.fillRect(180,70,600,190);x.fillStyle=p[4];x.fillRect(180,70,600,24);x.fillStyle=mood==='night'?'#FFF0A4':'#8EA1AA';for(let yy=110;yy<220;yy+=36)for(let xx=245;xx<720;xx+=48)x.fillRect(xx,yy,26,17);x.fillStyle='#151515';x.fillRect(435,185,90,75);x.fillStyle=p[5];x.font='24px sans-serif';x.fillText('浙江大学图书馆',390,55)}function drawLake(p){x.fillStyle='#3E7F8D';x.beginPath();x.ellipse(480,520,390,82,0,0,Math.PI*2);x.fill();x.fillStyle=p[2];x.beginPath();x.ellipse(480,505,370,74,0,0,Math.PI*2);x.fill();x.fillStyle='rgba(255,255,255,.22)';for(let i=0;i<18;i++)x.fillRect(150+(i*73+t)%660,480+(i%5)*18,42,3)}function drawPlayer(){x.fillStyle='rgba(0,0,0,.24)';x.beginPath();x.ellipse(player.x+13,player.y+37,18,6,0,0,6.28);x.fill();x.fillStyle='#151515';x.fillRect(player.x,player.y,26,34);x.fillStyle='#fff5e0';x.fillRect(player.x+4,player.y+4,18,14);x.fillStyle='#d03030';x.fillRect(player.x+2,player.y+18,22,4)}function drawSpirit(){const fy=Math.sin(t*.06+spirit.phase)*5;x.save();x.translate(spirit.x,spirit.y+fy);x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(0,24,18,5,0,0,6.28);x.fill();for(let i=-2;i<=2;i++){x.strokeStyle='rgba(126,194,238,.8)';x.lineWidth=2;x.beginPath();x.moveTo(i*5,8);x.quadraticCurveTo(i*5+Math.sin(t*.08+i)*4,18,i*4,26);x.stroke()}x.fillStyle=mood==='warm'?'rgba(139,204,246,.68)':mood==='rain'?'rgba(160,220,255,.78)':'rgba(120,180,240,.72)';x.strokeStyle='rgba(220,242,255,.95)';x.lineWidth=2;x.beginPath();x.moveTo(-22,5);x.quadraticCurveTo(-16,-16,0,-17);x.quadraticCurveTo(16,-16,22,5);x.quadraticCurveTo(8,15,-22,5);x.fill();x.stroke();x.fillStyle='#2a3b4c';x.fillRect(-7,-2,3,3);x.fillRect(6,-2,3,3);x.restore()}function update(){t++;if(!paused){let ix=(keys.d?1:0)-(keys.a?1:0),iy=(keys.s?1:0)-(keys.w?1:0);player.vx=(player.vx+ix*.45)*.82;player.vy=(player.vy+iy*.45)*.82;player.x=clamp(player.x+player.vx,80,850);player.y=clamp(player.y+player.vy,280,545);let dx=player.x+13-spirit.x,dy=player.y+8-spirit.y,d=Math.hypot(dx,dy)||1;if(d>58){spirit.x+=dx/d*2.2;spirit.y+=dy/d*2.2}spirit.joy+=(Math.random()-.5)*.01;spirit.joy=clamp(spirit.joy,0,1)}if(qt>0)qt--;document.getElementById('hint').textContent=Math.hypot(player.x-bench.x,player.y-bench.y)<54?'📖 按 E 坐在长椅上写心情':'WASD移动 | 空格呼唤精灵 | M切换天气 | E写日记'}function draw(){const p=pal[mood];x.fillStyle=p[0];x.fillRect(0,0,960,640);x.fillStyle=p[1];x.fillRect(0,260,960,380);for(let i=0;i<80;i++){x.fillStyle=i%2?'rgba(255,255,255,.08)':'rgba(0,0,0,.04)';x.fillRect((i*97)%960,280+(i*61)%320,34,2)}drawLake(p);drawBuilding(p);x.fillStyle='#CFC8B8';x.fillRect(250,260,460,170);x.fillRect(455,260,50,280);x.fillStyle='#9B6A3B';x.fillRect(bench.x-38,bench.y,76,10);x.fillRect(bench.x-36,bench.y+14,72,8);drawPlayer();drawSpirit();if(qt>0){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(220,86,520,56);x.strokeStyle='rgba(255,208,96,.9)';x.strokeRect(220,86,520,56);x.fillStyle='#fff5e0';x.font='20px sans-serif';x.fillText(quote,248,121)}}function loop(){update();draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='m')setMood(mood==='warm'?'night':mood==='night'?'rain':'warm');if(k===' '){quote='水母听见你了，慢慢靠近。';qt=160}if(k==='e'&&Math.hypot(player.x-bench.x,player.y-bench.y)<54){paused=true;document.getElementById('diary').classList.add('open')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.getElementById('close').onclick=()=>{paused=false;document.getElementById('diary').classList.remove('open')};document.getElementById('save').onclick=()=>{const v=document.getElementById('text').value;if(/累|烦|焦虑|难过|压力|困/.test(v))setMood('rain');else if(/夜|孤独|睡不着|安静/.test(v))setMood('night');else setMood('warm');document.getElementById('text').value='';paused=false;document.getElementById('diary').classList.remove('open')};setMood('warm');loop();</script></body></html>
