<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>像素地牢突击 · 元气风 Roguelite</title>
  <style>
    :root {
      --bg: #111827;
      --panel: rgba(15, 23, 42, 0.88);
      --panel-strong: #172033;
      --gold: #ffd166;
      --mint: #6ee7b7;
      --cyan: #67e8f9;
      --pink: #fb7185;
      --purple: #a78bfa;
      --ink: #e5f2ff;
      --muted: #9fb0c8;
      --danger: #ef4444;
      --tile: 32px;
      font-family: "Trebuchet MS", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(103, 232, 249, 0.24), transparent 25%),
        radial-gradient(circle at 80% 10%, rgba(251, 113, 133, 0.18), transparent 28%),
        linear-gradient(135deg, #0f172a 0%, #111827 52%, #1e1b4b 100%);
      image-rendering: pixelated;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(520px, 1fr) 300px;
      gap: 18px;
      height: 100vh;
      padding: 18px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 4px solid #243047;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38), inset 0 0 0 2px rgba(255,255,255,0.04);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 16px 16px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 65%);
    }

    .side {
      padding: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .logo {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border: 4px solid #0f172a;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), #f97316);
      box-shadow: 0 8px 0 #6b3411;
      font-size: 32px;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0 #0f172a;
    }

    .tagline {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .stat {
      padding: 12px;
      border: 3px solid #26344f;
      border-radius: 16px;
      background: rgba(3, 7, 18, 0.44);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 22px;
      color: var(--gold);
    }

    .bar-wrap {
      height: 18px;
      border: 3px solid #111827;
      border-radius: 999px;
      overflow: hidden;
      background: #0b1020;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.45);
    }

    .bar {
      height: 100%;
      width: 100%;
      transition: width 0.15s linear;
      background: linear-gradient(90deg, #22c55e, #bef264);
    }

    .bar.energy { background: linear-gradient(90deg, #38bdf8, #a78bfa); }

    .meter-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin: 12px 0 6px;
    }

    .card {
      margin-top: 16px;
      padding: 16px;
      border: 3px solid #26344f;
      border-radius: 18px;
      background: rgba(8, 13, 27, 0.68);
    }

    .card h2 {
      margin-bottom: 10px;
      color: var(--cyan);
      font-size: 18px;
    }

    .controls {
      display: grid;
      gap: 8px;
      color: #dbeafe;
      font-size: 14px;
      line-height: 1.45;
    }

    kbd {
      display: inline-block;
      min-width: 24px;
      padding: 2px 6px;
      border: 2px solid #465774;
      border-radius: 7px;
      color: #fff;
      background: #111827;
      box-shadow: 0 3px 0 #020617;
      text-align: center;
      font-weight: 700;
    }

    .game-shell {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .canvas-frame {
      position: relative;
      width: min(100%, 960px);
      aspect-ratio: 16 / 10;
      border: 6px solid #0f172a;
      border-radius: 22px;
      overflow: hidden;
      background: #111827;
      box-shadow: 0 14px 0 #060914, 0 28px 60px rgba(0,0,0,0.45);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      background: #141b2d;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(circle at center, rgba(15,23,42,0.72), rgba(2,6,23,0.94));
      text-align: center;
    }

    .overlay.hidden { display: none; }

    .modal {
      max-width: 620px;
      padding: 28px;
      border: 5px solid #334155;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 16px 0 #020617;
    }

    .modal h2 {
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 38px;
      text-shadow: 4px 4px 0 #7c2d12;
    }

    .modal p {
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      color: #111827;
      background: linear-gradient(180deg, #fde68a, #f59e0b);
      box-shadow: 0 7px 0 #92400e;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.2s;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(5px); box-shadow: 0 2px 0 #92400e; }

    .shop-grid {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .shop-item {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 12px;
      border: 3px solid #2d3b58;
      border-radius: 16px;
      padding: 12px;
      color: var(--ink);
      background: rgba(2, 6, 23, 0.46);
      box-shadow: none;
      text-align: left;
    }

    .shop-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #243047;
      font-size: 24px;
    }

    .shop-item b { color: var(--gold); }
    .shop-item small { color: var(--muted); }
    .price { color: var(--mint); font-weight: 900; }

    .mini-map {
      display: grid;
      grid-template-columns: repeat(5, 28px);
      gap: 7px;
      justify-content: center;
      margin: 14px 0 8px;
    }

    .room-dot {
      width: 28px;
      height: 28px;
      border: 3px solid #334155;
      border-radius: 8px;
      background: #0f172a;
    }

    .room-dot.active { background: var(--gold); box-shadow: 0 0 18px rgba(255,209,102,0.65); }
    .room-dot.clear { background: #22c55e; }
    .room-dot.boss { border-color: var(--pink); }

    .log {
      height: 210px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.4;
    }

    .log p {
      padding: 8px 10px;
      border-left: 4px solid var(--purple);
      border-radius: 8px;
      background: rgba(15,23,42,0.75);
    }

    .weapon-name { color: var(--cyan); font-weight: 900; }
    .mobile-pad { display: none; }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }
      .canvas-frame { width: 100%; }
      .right-panel { order: 3; }
    }

    @media (max-width: 720px) {
      .app { padding: 10px; gap: 10px; }
      .side { padding: 16px; }
      h1 { font-size: 22px; }
      .modal h2 { font-size: 30px; }
      .mobile-pad {
        position: absolute;
        inset: auto 14px 14px 14px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }
      .pad-cluster {
        display: grid;
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(3, 44px);
        gap: 6px;
        pointer-events: auto;
      }
      .pad-cluster button, .fire-mobile {
        padding: 0;
        min-width: 44px;
        min-height: 44px;
        border-radius: 12px;
        box-shadow: 0 4px 0 #020617;
        background: rgba(148, 163, 184, 0.48);
        color: white;
      }
      .pad-empty { visibility: hidden; }
      .fire-mobile { align-self: end; width: 74px; height: 74px; border-radius: 50%; background: rgba(251,113,133,0.68); }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel side">
      <div class="brand">
        <div class="logo">⚔️</div>
        <div>
          <h1>像素地牢突击</h1>
          <p class="tagline">轻量 Roguelite · 弹幕闯关 · 随机祝福</p>
        </div>
      </div>

      <div class="meter-label"><span>生命</span><strong id="hpText">100 / 100</strong></div>
      <div class="bar-wrap"><div id="hpBar" class="bar"></div></div>
      <div class="meter-label"><span>能量</span><strong id="energyText">80 / 80</strong></div>
      <div class="bar-wrap"><div id="energyBar" class="bar energy"></div></div>

      <section class="stat-grid">
        <div class="stat"><span>金币</span><strong id="coinText">0</strong></div>
        <div class="stat"><span>层数</span><strong id="levelText">1-1</strong></div>
        <div class="stat"><span>击败</span><strong id="killText">0</strong></div>
        <div class="stat"><span>连击</span><strong id="comboText">0</strong></div>
      </section>

      <section class="card">
        <h2>当前武器</h2>
        <p><span id="weaponName" class="weapon-name">星尘手枪</span></p>
        <p id="weaponDesc" class="tagline">均衡射速，适合清理小怪。</p>
      </section>

      <section class="card">
        <h2>操作</h2>
        <div class="controls">
          <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键移动</p>
          <p><kbd>鼠标</kbd> 瞄准，<kbd>左键</kbd> 或 <kbd>空格</kbd> 射击</p>
          <p><kbd>Shift</kbd> 冲刺闪避，<kbd>R</kbd> 重新开始</p>
        </div>
      </section>
    </aside>

    <section class="panel game-shell">
      <div class="canvas-frame" id="frame">
        <canvas id="game" width="960" height="600" aria-label="像素地牢突击游戏画布"></canvas>
        <div id="overlay" class="overlay">
          <div class="modal">
            <h2 id="overlayTitle">像素地牢突击</h2>
            <p id="overlayText">选择英雄进入随机房间，击败怪物、开启宝箱、购买升级，挑战最终水晶守卫。</p>
            <button id="startBtn">开始冒险</button>
          </div>
        </div>
        <div class="mobile-pad" aria-hidden="true">
          <div class="pad-cluster">
            <button class="pad-empty">·</button><button data-key="w">▲</button><button class="pad-empty">·</button>
            <button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button>
            <button class="pad-empty">·</button><button data-dash="true">⚡</button><button class="pad-empty">·</button>
          </div>
          <button class="fire-mobile" data-fire="true">开火</button>
        </div>
      </div>
    </section>

    <aside class="panel side right-panel">
      <section class="card" style="margin-top:0">
        <h2>地牢地图</h2>
        <div class="mini-map" id="miniMap"></div>
        <p class="tagline">清空房间后进入传送门。第 5 间会出现 Boss。</p>
      </section>

      <section class="card">
        <h2>商店 / 祝福</h2>
        <div class="shop-grid" id="shopGrid"></div>
      </section>

      <section class="card">
        <h2>冒险日志</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const frame = document.getElementById('frame');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');

    const ui = {
      hpText: document.getElementById('hpText'), hpBar: document.getElementById('hpBar'),
      energyText: document.getElementById('energyText'), energyBar: document.getElementById('energyBar'),
      coinText: document.getElementById('coinText'), levelText: document.getElementById('levelText'),
      killText: document.getElementById('killText'), comboText: document.getElementById('comboText'),
      weaponName: document.getElementById('weaponName'), weaponDesc: document.getElementById('weaponDesc'),
      shopGrid: document.getElementById('shopGrid'), miniMap: document.getElementById('miniMap'), log: document.getElementById('log')
    };

    const W = canvas.width;
    const H = canvas.height;
    const keys = new Set();
    const mouse = { x: W / 2, y: H / 2, down: false };
    let last = 0;
    let running = false;
    let rafId = 0;

    const weapons = [
      { name: '星尘手枪', desc: '均衡射速，适合清理小怪。', damage: 16, speed: 590, rate: 210, cost: 7, spread: 0.04, pellets: 1, color: '#67e8f9' },
      { name: '胡萝卜散弹', desc: '近距离多弹丸，清房很爽。', damage: 9, speed: 520, rate: 430, cost: 12, spread: 0.28, pellets: 5, color: '#fb923c' },
      { name: '霜糖法杖', desc: '高伤害慢弹，附带穿透感。', damage: 28, speed: 430, rate: 520, cost: 15, spread: 0.02, pellets: 1, color: '#a78bfa' }
    ];

    const blessings = [
      { icon: '❤️', title: '热血护符', text: '最大生命 +25，并立刻治疗。', price: 18, apply: s => { s.player.maxHp += 25; s.player.hp = Math.min(s.player.maxHp, s.player.hp + 35); } },
      { icon: '⚡', title: '能量电池', text: '最大能量 +20，恢复速度提升。', price: 16, apply: s => { s.player.maxEnergy += 20; s.player.energyRegen += 5; } },
      { icon: '🔥', title: '暴击芯片', text: '武器伤害 +20%。', price: 22, apply: s => { s.player.damageMul *= 1.2; } },
      { icon: '👟', title: '疾风靴', text: '移动速度 +12%。', price: 14, apply: s => { s.player.speed *= 1.12; } }
    ];

    const state = {
      room: 1,
      kills: 0,
      combo: 0,
      coins: 0,
      cameraShake: 0,
      portal: null,
      roomClear: false,
      player: null,
      bullets: [],
      enemyBullets: [],
      enemies: [],
      particles: [],
      pickups: [],
      props: [],
      shop: [],
      weaponIndex: 0,
      roomsClear: new Set()
    };

    function resetGame() {
      Object.assign(state, {
        room: 1, kills: 0, combo: 0, coins: 0, cameraShake: 0, portal: null, roomClear: false,
        bullets: [], enemyBullets: [], enemies: [], particles: [], pickups: [], props: [], shop: [], weaponIndex: 0,
        roomsClear: new Set()
      });
      state.player = {
        x: W / 2, y: H / 2, r: 15, hp: 100, maxHp: 100, energy: 80, maxEnergy: 80,
        energyRegen: 16, speed: 215, dash: 0, invuln: 0, shootCd: 0, damageMul: 1
      };
      addLog('你在霓虹地牢入口醒来，武器已上膛。');
      buildRoom();
      refreshShop();
      updateUI();
    }

    function buildRoom() {
      state.bullets.length = 0;
      state.enemyBullets.length = 0;
      state.enemies.length = 0;
      state.particles.length = 0;
      state.pickups.length = 0;
      state.props.length = 0;
      state.portal = null;
      state.roomClear = false;
      state.player.x = W / 2;
      state.player.y = H / 2;

      const propCount = 6 + state.room;
      for (let i = 0; i < propCount; i++) {
        state.props.push({
          x: rand(90, W - 90), y: rand(80, H - 80), w: rand(28, 58), h: rand(24, 48),
          hp: 22, color: Math.random() > 0.5 ? '#334155' : '#3f2d56'
        });
      }

      const isBoss = state.room === 5;
      const count = isBoss ? 1 : 4 + state.room * 2;
      for (let i = 0; i < count; i++) spawnEnemy(isBoss ? 'boss' : (Math.random() > 0.72 ? 'mage' : 'slime'));
      addLog(isBoss ? 'Boss 房开启：水晶守卫正在充能！' : `第 ${state.room} 间房：怪物正在靠近。`);
      updateMap();
    }

    function spawnEnemy(type) {
      const side = Math.floor(Math.random() * 4);
      const pos = [
        { x: rand(60, W - 60), y: 50 }, { x: W - 50, y: rand(60, H - 60) },
        { x: rand(60, W - 60), y: H - 50 }, { x: 50, y: rand(60, H - 60) }
      ][side];
      const boss = type === 'boss';
      state.enemies.push({
        ...pos, type, r: boss ? 34 : type === 'mage' ? 18 : 16,
        hp: boss ? 520 : type === 'mage' ? 72 + state.room * 10 : 46 + state.room * 8,
        maxHp: boss ? 520 : type === 'mage' ? 72 + state.room * 10 : 46 + state.room * 8,
        speed: boss ? 70 : type === 'mage' ? 86 : 112,
        touch: boss ? 24 : 12,
        cd: rand(300, 1200),
        color: boss ? '#fb7185' : type === 'mage' ? '#a78bfa' : '#6ee7b7'
      });
    }

    function refreshShop() {
      state.shop = [
        blessings[Math.floor(Math.random() * blessings.length)],
        { icon: '🔫', title: weapons[(state.weaponIndex + 1) % weapons.length].name, text: weapons[(state.weaponIndex + 1) % weapons.length].desc, price: 20, weapon: true },
        { icon: '🍖', title: '烤肉便当', text: '恢复 45 生命。', price: 12, apply: s => { s.player.hp = Math.min(s.player.maxHp, s.player.hp + 45); } }
      ];
      renderShop();
    }

    function renderShop() {
      ui.shopGrid.innerHTML = '';
      state.shop.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'shop-item';
        btn.innerHTML = `<span class="shop-icon">${item.icon}</span><span><b>${item.title}</b><br><small>${item.text}</small></span><span class="price">${item.price}G</span>`;
        btn.addEventListener('click', () => buy(idx));
        ui.shopGrid.appendChild(btn);
      });
    }

    function buy(idx) {
      const item = state.shop[idx];
      if (!item || state.coins < item.price) {
        addLog('金币不足，商人摇了摇头。');
        return;
      }
      state.coins -= item.price;
      if (item.weapon) state.weaponIndex = (state.weaponIndex + 1) % weapons.length;
      else item.apply(state);
      addLog(`购买成功：${item.title}`);
      state.shop.splice(idx, 1);
      renderShop();
      updateUI();
    }

    function update(dt) {
      const p = state.player;
      if (!p) return;
      p.shootCd -= dt;
      p.invuln -= dt;
      p.dash -= dt;
      p.energy = Math.min(p.maxEnergy, p.energy + p.energyRegen * dt / 1000);

      let dx = 0, dy = 0;
      if (keys.has('w') || keys.has('arrowup')) dy -= 1;
      if (keys.has('s') || keys.has('arrowdown')) dy += 1;
      if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
      if (keys.has('d') || keys.has('arrowright')) dx += 1;
      const len = Math.hypot(dx, dy) || 1;
      const dashMul = p.dash > 0 ? 2.7 : 1;
      p.x = clamp(p.x + dx / len * p.speed * dashMul * dt / 1000, 42, W - 42);
      p.y = clamp(p.y + dy / len * p.speed * dashMul * dt / 1000, 42, H - 42);

      if ((mouse.down || keys.has(' ')) && p.shootCd <= 0) shoot();
      if (keys.has('shift')) dash();

      updateBullets(dt);
      updateEnemies(dt);
      updatePickups(dt);
      updateParticles(dt);

      if (!state.roomClear && state.enemies.length === 0) clearRoom();
      if (state.portal && dist(p, state.portal) < 42 && state.room < 5) nextRoom();
      if (state.portal && dist(p, state.portal) < 42 && state.room === 5) winGame();
      updateUI();
    }

    function shoot() {
      const p = state.player;
      const w = weapons[state.weaponIndex];
      if (p.energy < w.cost) return;
      p.energy -= w.cost;
      p.shootCd = w.rate;
      const base = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      for (let i = 0; i < w.pellets; i++) {
        const angle = base + rand(-w.spread, w.spread);
        state.bullets.push({
          x: p.x + Math.cos(angle) * 20, y: p.y + Math.sin(angle) * 20,
          vx: Math.cos(angle) * w.speed, vy: Math.sin(angle) * w.speed,
          r: 5, life: 900, damage: w.damage * p.damageMul, color: w.color
        });
      }
      burst(p.x + Math.cos(base) * 24, p.y + Math.sin(base) * 24, w.color, 4, 1.4);
    }

    function dash() {
      const p = state.player;
      if (p.dash <= 0 && p.energy >= 14) {
        p.energy -= 14;
        p.dash = 130;
        p.invuln = 260;
        state.cameraShake = 5;
        burst(p.x, p.y, '#ffffff', 12, 2.2);
      }
      keys.delete('shift');
    }

    function updateBullets(dt) {
      for (const b of [...state.bullets]) {
        b.x += b.vx * dt / 1000;
        b.y += b.vy * dt / 1000;
        b.life -= dt;
        for (const e of [...state.enemies]) {
          if (dist(b, e) < b.r + e.r) {
            e.hp -= b.damage;
            b.life = 0;
            burst(b.x, b.y, e.color, 8, 1.7);
            state.cameraShake = Math.max(state.cameraShake, 3);
            if (e.hp <= 0) killEnemy(e);
            break;
          }
        }
      }
      state.bullets = state.bullets.filter(b => b.life > 0 && b.x > 20 && b.x < W - 20 && b.y > 20 && b.y < H - 20);

      for (const b of [...state.enemyBullets]) {
        b.x += b.vx * dt / 1000;
        b.y += b.vy * dt / 1000;
        b.life -= dt;
        if (dist(b, state.player) < b.r + state.player.r) {
          hurt(b.damage);
          b.life = 0;
        }
      }
      state.enemyBullets = state.enemyBullets.filter(b => b.life > 0 && b.x > 20 && b.x < W - 20 && b.y > 20 && b.y < H - 20);
    }

    function updateEnemies(dt) {
      const p = state.player;
      for (const e of state.enemies) {
        const angle = Math.atan2(p.y - e.y, p.x - e.x);
        const keepAway = e.type === 'mage' && dist(e, p) < 190;
        const dir = keepAway ? -1 : 1;
        e.x += Math.cos(angle) * e.speed * dir * dt / 1000;
        e.y += Math.sin(angle) * e.speed * dir * dt / 1000;
        e.x = clamp(e.x, 42, W - 42);
        e.y = clamp(e.y, 42, H - 42);
        e.cd -= dt;
        if ((e.type === 'mage' || e.type === 'boss') && e.cd <= 0) enemyShoot(e);
        if (dist(e, p) < e.r + p.r) hurt(e.touch);
      }
    }

    function enemyShoot(e) {
      const p = state.player;
      const shots = e.type === 'boss' ? 10 : 1;
      const base = Math.atan2(p.y - e.y, p.x - e.x);
      for (let i = 0; i < shots; i++) {
        const angle = e.type === 'boss' ? base + (Math.PI * 2 / shots) * i : base;
        const speed = e.type === 'boss' ? 210 : 245;
        state.enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 6, life: 2600, damage: e.type === 'boss' ? 11 : 9, color: e.color });
      }
      e.cd = e.type === 'boss' ? 880 : rand(900, 1450);
    }

    function killEnemy(e) {
      state.enemies.splice(state.enemies.indexOf(e), 1);
      state.kills++;
      state.combo++;
      const coins = e.type === 'boss' ? 60 : Math.floor(rand(3, 8));
      state.coins += coins;
      state.pickups.push({ x: e.x, y: e.y, r: 9, type: 'coin', value: coins, life: 7000 });
      if (Math.random() > 0.78) state.pickups.push({ x: e.x + rand(-16,16), y: e.y + rand(-16,16), r: 10, type: 'heart', value: 12, life: 7000 });
      burst(e.x, e.y, e.color, e.type === 'boss' ? 42 : 18, 2.4);
      addLog(`击败 ${e.type === 'boss' ? '水晶守卫' : e.type === 'mage' ? '法师菇' : '弹弹史莱姆'}，获得 ${coins} 金币。`);
    }

    function hurt(amount) {
      const p = state.player;
      if (p.invuln > 0) return;
      p.hp -= amount;
      p.invuln = 620;
      p.combo = 0;
      state.combo = 0;
      state.cameraShake = 10;
      burst(p.x, p.y, '#ef4444', 16, 2);
      if (p.hp <= 0) gameOver();
    }

    function updatePickups(dt) {
      const p = state.player;
      for (const item of state.pickups) {
        item.life -= dt;
        if (dist(item, p) < 90) {
          const a = Math.atan2(p.y - item.y, p.x - item.x);
          item.x += Math.cos(a) * 260 * dt / 1000;
          item.y += Math.sin(a) * 260 * dt / 1000;
        }
        if (dist(item, p) < p.r + item.r) {
          if (item.type === 'heart') p.hp = Math.min(p.maxHp, p.hp + item.value);
          item.life = 0;
        }
      }
      state.pickups = state.pickups.filter(i => i.life > 0);
    }

    function updateParticles(dt) {
      for (const p of state.particles) {
        p.x += p.vx * dt / 1000;
        p.y += p.vy * dt / 1000;
        p.life -= dt;
        p.size *= 0.985;
      }
      state.particles = state.particles.filter(p => p.life > 0 && p.size > 0.4);
      state.cameraShake *= 0.9;
    }

    function clearRoom() {
      state.roomClear = true;
      state.roomsClear.add(state.room);
      state.portal = { x: W - 95, y: H / 2, r: 28, t: 0 };
      const heal = Math.min(18, state.player.maxHp - state.player.hp);
      state.player.hp += heal;
      state.player.energy = state.player.maxEnergy;
      addLog(state.room === 5 ? 'Boss 被净化！进入传送门完成冒险。' : '房间已清空，传送门开启，能量已补满。');
      refreshShop();
      updateMap();
    }

    function nextRoom() {
      if (state.room >= 5) return;
      state.room++;
      state.combo = 0;
      buildRoom();
    }

    function gameOver() {
      running = false;
      cancelAnimationFrame(rafId);
      overlayTitle.textContent = '冒险失败';
      overlayText.textContent = `你闯到第 ${state.room} 间房，击败 ${state.kills} 只怪物。调整走位和冲刺时机，再来一局！`;
      startBtn.textContent = '重新开始';
      overlay.classList.remove('hidden');
      updateUI();
    }

    function winGame() {
      running = false;
      cancelAnimationFrame(rafId);
      overlayTitle.textContent = '通关成功！';
      overlayText.textContent = `你净化了霓虹地牢，带回 ${state.coins} 金币并击败 ${state.kills} 个敌人。`;
      startBtn.textContent = '再来一局';
      overlay.classList.remove('hidden');
    }

    function draw() {
      const shakeX = rand(-state.cameraShake, state.cameraShake);
      const shakeY = rand(-state.cameraShake, state.cameraShake);
      ctx.save();
      ctx.clearRect(0, 0, W, H);
      ctx.translate(shakeX, shakeY);
      drawDungeon();
      state.props.forEach(drawProp);
      if (state.portal) drawPortal(state.portal);
      state.pickups.forEach(drawPickup);
      state.bullets.forEach(b => drawCircle(b.x, b.y, b.r, b.color, '#e0f2fe'));
      state.enemyBullets.forEach(b => drawCircle(b.x, b.y, b.r, b.color, '#fee2e2'));
      state.enemies.forEach(drawEnemy);
      drawPlayer();
      state.particles.forEach(p => drawRect(p.x, p.y, p.size, p.color));
      ctx.restore();
    }

    function drawDungeon() {
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, W, H);
      for (let y = 32; y < H - 32; y += 32) {
        for (let x = 32; x < W - 32; x += 32) {
          ctx.fillStyle = (x / 32 + y / 32) % 2 ? '#182238' : '#151f33';
          ctx.fillRect(x, y, 32, 32);
          ctx.fillStyle = 'rgba(255,255,255,0.035)';
          ctx.fillRect(x, y, 2, 32);
          ctx.fillRect(x, y, 32, 2);
        }
      }
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 18;
      ctx.strokeRect(30, 30, W - 60, H - 60);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 8;
      ctx.strokeRect(44, 44, W - 88, H - 88);
      ctx.fillStyle = '#27354f';
      ctx.fillRect(70, 54, 80, 18);
      ctx.fillRect(W - 150, H - 72, 80, 18);
    }

    function drawPlayer() {
      const p = state.player;
      const flicker = p.invuln > 0 && Math.floor(performance.now() / 80) % 2;
      if (flicker) return;
      const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);
      drawCircle(0, 0, p.r + 7, '#0f172a');
      drawCircle(0, 0, p.r + 2, '#fbbf24');
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(8, -6, 28, 12);
      ctx.fillStyle = '#e0f2fe';
      ctx.fillRect(20, -3, 15, 6);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-4, -5, 5, 5);
      ctx.restore();
    }

    function drawEnemy(e) {
      drawCircle(e.x, e.y, e.r + 5, '#0f172a');
      drawCircle(e.x, e.y, e.r, e.color);
      ctx.fillStyle = '#111827';
      ctx.fillRect(e.x - e.r * 0.45, e.y - 3, 5, 5);
      ctx.fillRect(e.x + e.r * 0.2, e.y - 3, 5, 5);
      const w = e.r * 2;
      ctx.fillStyle = '#020617';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 14, w, 5);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 14, w * (e.hp / e.maxHp), 5);
      if (e.type === 'boss') {
        ctx.strokeStyle = '#fff7ed';
        ctx.lineWidth = 3;
        ctx.strokeRect(e.x - 16, e.y - 48, 32, 16);
      }
    }

    function drawProp(p) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(p.x - p.w / 2 + 5, p.y - p.h / 2 + 7, p.w, p.h);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      ctx.fillStyle = 'rgba(255,255,255,0.11)';
      ctx.fillRect(p.x - p.w / 2 + 5, p.y - p.h / 2 + 5, p.w - 10, 5);
    }

    function drawPickup(item) {
      const color = item.type === 'heart' ? '#fb7185' : '#ffd166';
      drawCircle(item.x, item.y, item.r + Math.sin(performance.now() / 120) * 2, color, '#fff7ed');
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(item.type === 'heart' ? '+' : '$', item.x, item.y + 4);
    }

    function drawPortal(portal) {
      portal.t += 0.05;
      for (let i = 4; i > 0; i--) {
        ctx.strokeStyle = `rgba(103, 232, 249, ${0.16 * i})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(portal.x, portal.y, portal.r + i * 7 + Math.sin(portal.t + i) * 4, portal.r * 0.72 + i * 5, portal.t + i, 0, Math.PI * 2);
        ctx.stroke();
      }
      drawCircle(portal.x, portal.y, 14, '#67e8f9', '#ecfeff');
    }

    function drawCircle(x, y, r, fill, stroke) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) { ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function drawRect(x, y, size, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x - size / 2, y - size / 2, size, size);
    }

    function burst(x, y, color, count, power) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = rand(35, 130) * power;
        state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: rand(3, 8), life: rand(260, 620), color });
      }
    }

    function loop(now) {
      const dt = Math.min(34, now - last || 16);
      last = now;
      if (running) update(dt);
      draw();
      if (running) rafId = requestAnimationFrame(loop);
    }

    function updateUI() {
      const p = state.player;
      if (!p) return;
      ui.hpText.textContent = `${Math.max(0, Math.ceil(p.hp))} / ${p.maxHp}`;
      ui.energyText.textContent = `${Math.floor(p.energy)} / ${p.maxEnergy}`;
      ui.hpBar.style.width = `${clamp(p.hp / p.maxHp * 100, 0, 100)}%`;
      ui.energyBar.style.width = `${clamp(p.energy / p.maxEnergy * 100, 0, 100)}%`;
      ui.coinText.textContent = state.coins;
      ui.levelText.textContent = `1-${state.room}`;
      ui.killText.textContent = state.kills;
      ui.comboText.textContent = state.combo;
      ui.weaponName.textContent = weapons[state.weaponIndex].name;
      ui.weaponDesc.textContent = weapons[state.weaponIndex].desc;
    }

    function updateMap() {
      ui.miniMap.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const dot = document.createElement('div');
        dot.className = 'room-dot' + (i === state.room ? ' active' : '') + (state.roomsClear.has(i) ? ' clear' : '') + (i === 5 ? ' boss' : '');
        ui.miniMap.appendChild(dot);
      }
    }

    function addLog(text) {
      const p = document.createElement('p');
      p.textContent = text;
      ui.log.prepend(p);
      while (ui.log.children.length > 8) ui.log.lastChild.remove();
    }

    function start() {
      resetGame();
      overlay.classList.add('hidden');
      running = true;
      last = performance.now();
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) e.preventDefault();
      if (key === 'r') start();
      keys.add(key);
    });
    window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) / rect.width * W;
      mouse.y = (e.clientY - rect.top) / rect.height * H;
    }
    frame.addEventListener('mousemove', pointerPos);
    frame.addEventListener('mousedown', e => { pointerPos(e); mouse.down = true; });
    window.addEventListener('mouseup', () => mouse.down = false);
    frame.addEventListener('touchmove', e => { if (e.touches[0]) pointerPos(e.touches[0]); }, { passive: true });

    document.querySelectorAll('[data-key]').forEach(btn => {
      const key = btn.dataset.key;
      btn.addEventListener('touchstart', e => { e.preventDefault(); keys.add(key); });
      btn.addEventListener('touchend', e => { e.preventDefault(); keys.delete(key); });
    });
    document.querySelector('[data-fire]').addEventListener('touchstart', e => { e.preventDefault(); mouse.down = true; });
    document.querySelector('[data-fire]').addEventListener('touchend', e => { e.preventDefault(); mouse.down = false; });
    document.querySelector('[data-dash]').addEventListener('touchstart', e => { e.preventDefault(); keys.add('shift'); });

    startBtn.addEventListener('click', start);
    resetGame();
    draw();
  </script>
</body>
</html>
