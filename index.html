<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLens · 即时数据可视化匹配器</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f2ea;
            --panel: rgba(255,255,255,0.86);
            --panel-strong: #ffffff;
            --ink: #1f2430;
            --muted: #6d7280;
            --line: #e5dccc;
            --accent: #7c5cff;
            --accent-2: #00a7a7;
            --accent-3: #ff9f43;
            --danger: #c44242;
            --shadow: 0 24px 70px rgba(52, 43, 31, 0.13);
            --radius: 28px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(124, 92, 255, 0.18), transparent 34rem),
                radial-gradient(circle at 88% 12%, rgba(0, 167, 167, 0.14), transparent 30rem),
                linear-gradient(135deg, #fbfaf7 0%, var(--bg) 100%);
        }
        button, textarea, select { font: inherit; }
        .shell { width: min(1440px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 44px; }
        .hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 24px;
            align-items: end;
            margin-bottom: 22px;
        }
        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 8px 13px;
            border: 1px solid rgba(124, 92, 255, 0.22);
            border-radius: 999px;
            background: rgba(255,255,255,0.55);
            color: #5844c9;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: .04em;
        }
        h1 { margin: 18px 0 12px; font-size: clamp(34px, 6vw, 72px); line-height: .96; letter-spacing: -0.06em; }
        .lead { margin: 0; max-width: 820px; color: var(--muted); font-size: clamp(16px, 2vw, 20px); }
        .hero-card {
            width: min(360px, 100%);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: var(--radius);
            background: rgba(255,255,255,0.58);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }
        .hero-card strong { display:block; font-size: 30px; line-height: 1; margin-bottom: 8px; }
        .hero-card span { color: var(--muted); }
        .workspace { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 22px; align-items: stretch; }
        .panel {
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            overflow: hidden;
        }
        .panel-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
        .panel-head h2 { margin: 0 0 6px; font-size: 20px; }
        .panel-head p { margin: 0; color: var(--muted); font-size: 14px; }
        .input-area { padding: 18px; }
        textarea {
            width: 100%; min-height: 390px; resize: vertical;
            border: 1px solid var(--line); border-radius: 22px;
            padding: 16px; outline: none; color: var(--ink);
            background: rgba(255,255,255,0.78); line-height: 1.45;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
        }
        textarea:focus { border-color: rgba(124, 92, 255, 0.62); box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.12); }
        .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .btn {
            border: 0; border-radius: 999px; padding: 10px 14px;
            background: #efe9dc; color: #3a342c; cursor: pointer; font-weight: 700;
            transition: transform .18s, box-shadow .18s, background .18s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(42, 34, 24, .1); }
        .btn.primary { background: linear-gradient(135deg, var(--accent), #9b7cff); color: white; }
        .btn.ghost { background: rgba(255,255,255,.64); border: 1px solid var(--line); }
        .visual-panel { display: grid; grid-template-rows: auto auto minmax(520px, 1fr) auto; }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
        select {
            min-width: 220px; border: 1px solid var(--line); border-radius: 999px;
            padding: 10px 38px 10px 14px; background: white; color: var(--ink); outline: none;
        }
        .status { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 11px; font-size: 13px; font-weight: 700; background: #f3efe7; color: #665f55; }
        .pill.good { background: rgba(0,167,167,.11); color: #007979; }
        .pill.warn { background: rgba(255,159,67,.14); color: #a65d00; }
        .chart-wrap { padding: 18px; min-height: 520px; display: grid; }
        canvas { width: 100%; height: 100%; min-height: 500px; border-radius: 24px; background: #fffdfa; border: 1px solid var(--line); }
        .insights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 18px 18px; }
        .insight { padding: 14px; border-radius: 20px; background: rgba(255,255,255,.66); border: 1px solid var(--line); }
        .insight b { display: block; margin-bottom: 6px; }
        .insight span { color: var(--muted); font-size: 14px; }
        .error { margin-top: 12px; color: var(--danger); font-weight: 700; min-height: 20px; }
        @media (max-width: 1050px) {
            .hero, .workspace { grid-template-columns: 1fr; }
            .hero-card { width: 100%; }
            .visual-panel { grid-template-rows: auto auto minmax(440px, 1fr) auto; }
            .insights { grid-template-columns: 1fr; }
        }
        @media (max-width: 680px) {
            .shell { width: min(100% - 20px, 1440px); padding-top: 18px; }
            .panel-head, .input-area, .toolbar, .chart-wrap { padding-left: 14px; padding-right: 14px; }
            textarea { min-height: 300px; }
            canvas { min-height: 420px; }
            .status { margin-left: 0; width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <div>
                <div class="eyebrow">⚡ DataLens · Live Matcher</div>
                <h1>多维数据可视化即时生成器</h1>
                <p class="lead">粘贴 CSV 或 JSON 数据，系统会实时识别字段类型、自动推荐合适的可视化方式，并输出可下载图像与简明解释。</p>
            </div>
            <aside class="hero-card">
                <strong id="scoreText">智能匹配中</strong>
                <span>根据维度数量、字段类型与数据规模，在折线图、柱状图、散点图、气泡图、热力图、雷达图、平行坐标等类型间自动选择。</span>
            </aside>
        </section>

        <section class="workspace">
            <div class="panel">
                <div class="panel-head">
                    <h2>1. 输入多维数据</h2>
                    <p>支持带表头 CSV 或对象数组 JSON；修改内容后会即时重新解析与绘图。</p>
                </div>
                <div class="input-area">
                    <textarea id="dataInput" spellcheck="false" aria-label="输入 CSV 或 JSON 数据"></textarea>
                    <div class="button-row">
                        <button class="btn primary" data-sample="sales">销售样例</button>
                        <button class="btn" data-sample="city">城市样例</button>
                        <button class="btn" data-sample="survey">调研样例</button>
                        <button class="btn ghost" id="clearBtn">清空</button>
                    </div>
                    <div class="error" id="errorText"></div>
                </div>
            </div>

            <div class="panel visual-panel">
                <div class="panel-head">
                    <h2>2. 输出图像与说明</h2>
                    <p id="explainText">正在等待数据。</p>
                </div>
                <div class="toolbar">
                    <label>
                        可视化类型
                        <select id="chartType" aria-label="选择可视化类型"></select>
                    </label>
                    <button class="btn primary" id="downloadBtn">下载 PNG</button>
                    <button class="btn ghost" id="copyDemoBtn">复制说明</button>
                    <div class="status">
                        <span class="pill good" id="rowCount">0 行</span>
                        <span class="pill" id="dimensionCount">0 维</span>
                        <span class="pill warn" id="matchReason">未匹配</span>
                    </div>
                </div>
                <div class="chart-wrap"><canvas id="chartCanvas" width="1200" height="720"></canvas></div>
                <div class="insights">
                    <div class="insight"><b>字段识别</b><span id="fieldInsight">暂无</span></div>
                    <div class="insight"><b>推荐逻辑</b><span id="logicInsight">暂无</span></div>
                    <div class="insight"><b>阅读提示</b><span id="readingInsight">暂无</span></div>
                </div>
            </div>
        </section>
    </main>

<script>
const samples = {
    sales: `月份,地区,销售额,订单数,转化率\n2026-01,华东,128,42,0.23\n2026-02,华东,152,51,0.27\n2026-03,华东,169,58,0.29\n2026-04,华东,188,63,0.31\n2026-01,华南,96,35,0.19\n2026-02,华南,112,39,0.21\n2026-03,华南,147,47,0.25\n2026-04,华南,161,52,0.28\n2026-01,华北,88,31,0.18\n2026-02,华北,105,37,0.20\n2026-03,华北,118,41,0.22\n2026-04,华北,142,49,0.25`,
    city: `城市,人口,人均GDP,通勤时间,绿地率\n上海,2487,18.04,46,0.41\n北京,2189,19.00,52,0.48\n深圳,1779,19.75,39,0.45\n广州,1881,16.20,43,0.42\n成都,2140,9.81,37,0.43\n杭州,1252,15.30,34,0.44\n武汉,1374,11.20,41,0.39\n西安,1300,8.60,38,0.36`,
    survey: `指标,产品A,产品B,产品C\n易用性,86,78,91\n性能,82,88,84\n价格,76,92,69\n服务,90,74,82\n稳定性,88,81,86\n创新性,79,83,93`
};
const chartLabels = {
    auto: '自动推荐', line: '折线图', bar: '柱状图', scatter: '散点图', bubble: '气泡图', heatmap: '热力图', radar: '雷达图', parallel: '平行坐标'
};
const input = document.getElementById('dataInput');
const canvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d');
const chartTypeSelect = document.getElementById('chartType');
let state = { rows: [], fields: [], recommended: 'bar', explanation: '' };

Object.entries(chartLabels).forEach(([value, label]) => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    chartTypeSelect.appendChild(option);
});
input.value = samples.sales;

document.querySelectorAll('[data-sample]').forEach(btn => btn.addEventListener('click', () => {
    input.value = samples[btn.dataset.sample];
    update();
}));
document.getElementById('clearBtn').addEventListener('click', () => { input.value = ''; update(); input.focus(); });
input.addEventListener('input', debounce(update, 120));
chartTypeSelect.addEventListener('change', render);
document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `datalens-${activeType()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
});
document.getElementById('copyDemoBtn').addEventListener('click', async () => {
    const text = document.getElementById('explainText').textContent;
    try { await navigator.clipboard.writeText(text); } catch (e) {}
});

function debounce(fn, wait) {
    let timer;
    return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); };
}
function parseInput(raw) {
    const text = raw.trim();
    if (!text) return [];
    if (text.startsWith('[') || text.startsWith('{')) {
        const parsed = JSON.parse(text);
        return Array.isArray(parsed) ? parsed : [parsed];
    }
    const lines = text.split(/\r?\n/).filter(Boolean);
    const headers = splitCsvLine(lines[0]);
    return lines.slice(1).map(line => {
        const values = splitCsvLine(line);
        return headers.reduce((row, header, index) => {
            row[header.trim()] = normalizeValue(values[index]);
            return row;
        }, {});
    });
}
function splitCsvLine(line) {
    const result = [];
    let current = '', quoted = false;
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') quoted = !quoted;
        else if (char === ',' && !quoted) { result.push(current); current = ''; }
        else current += char;
    }
    result.push(current);
    return result;
}
function normalizeValue(value = '') {
    const trimmed = String(value).trim();
    if (trimmed === '') return null;
    const number = Number(trimmed.replace(/%$/, ''));
    if (!Number.isNaN(number) && /^-?\d+(\.\d+)?%?$/.test(trimmed)) return trimmed.endsWith('%') ? number / 100 : number;
    return trimmed;
}
function analyze(rows) {
    const names = [...new Set(rows.flatMap(row => Object.keys(row)))];
    return names.map(name => {
        const values = rows.map(row => row[name]).filter(v => v !== null && v !== undefined && v !== '');
        const numericCount = values.filter(v => typeof v === 'number' && Number.isFinite(v)).length;
        const dateCount = values.filter(v => !Number.isNaN(Date.parse(v)) && typeof v !== 'number').length;
        const unique = new Set(values.map(String)).size;
        const type = numericCount >= values.length * 0.8 ? 'numeric' : dateCount >= values.length * 0.8 ? 'date' : 'category';
        return { name, type, unique, values };
    });
}
function recommend(fields, rows) {
    const numeric = fields.filter(f => f.type === 'numeric');
    const category = fields.filter(f => f.type === 'category');
    const date = fields.filter(f => f.type === 'date');
    if (date.length && numeric.length) return ['line', '包含时间字段和数值字段，优先展示趋势变化。'];
    if (category.length >= 2 && numeric.length) return ['heatmap', '两个分类维度加一个数值维度，适合比较交叉强度。'];
    if (category.length && numeric.length >= 3 && rows.length <= 12) return ['radar', '少量对象拥有多个指标，适合查看轮廓差异。'];
    if (numeric.length >= 4 && rows.length <= 12) return ['radar', '少量对象拥有多个指标，适合查看轮廓差异。'];
    if (numeric.length >= 4 && rows.length > 12) return ['parallel', '多项连续指标并存，平行坐标能保留多维关系。'];
    if (numeric.length >= 3) return ['bubble', '至少三个数值字段，可用位置和气泡大小同时表达。'];
    if (numeric.length >= 2) return ['scatter', '两个数值字段适合观察相关性与离群点。'];
    if (category.length && numeric.length) return ['bar', '分类字段搭配数值字段，适合做大小对比。'];
    return ['bar', '数据结构较简单，默认用柱状图快速比较。'];
}
function update() {
    try {
        const rows = parseInput(input.value);
        if (!rows.length) throw new Error('请输入至少一行数据。');
        const fields = analyze(rows);
        const [recommended, explanation] = recommend(fields, rows);
        state = { rows, fields, recommended, explanation };
        document.getElementById('errorText').textContent = '';
        render();
    } catch (error) {
        state = { rows: [], fields: [], recommended: 'bar', explanation: '' };
        document.getElementById('errorText').textContent = `解析失败：${error.message}`;
        drawEmpty('请检查数据格式');
        updateMeta();
    }
}
function activeType() { return chartTypeSelect.value === 'auto' ? state.recommended : chartTypeSelect.value; }
function updateMeta() {
    const numeric = state.fields.filter(f => f.type === 'numeric').map(f => f.name);
    const categorical = state.fields.filter(f => f.type !== 'numeric').map(f => f.name);
    document.getElementById('rowCount').textContent = `${state.rows.length} 行`;
    document.getElementById('dimensionCount').textContent = `${state.fields.length} 维`;
    document.getElementById('matchReason').textContent = chartLabels[activeType()] || '未匹配';
    document.getElementById('scoreText').textContent = state.rows.length ? `${chartLabels[state.recommended]} 推荐` : '智能匹配中';
    document.getElementById('explainText').textContent = state.rows.length ? `已推荐「${chartLabels[state.recommended]}」：${state.explanation}` : '正在等待数据。';
    document.getElementById('fieldInsight').textContent = state.rows.length ? `数值：${numeric.join('、') || '无'}；分类/时间：${categorical.join('、') || '无'}。` : '暂无';
    document.getElementById('logicInsight').textContent = state.rows.length ? state.explanation : '暂无';
    document.getElementById('readingInsight').textContent = state.rows.length ? readingTip(activeType()) : '暂无';
}
function readingTip(type) {
    return {
        line: '关注斜率、峰值和不同系列间的拐点。', bar: '比较柱长即可发现分类之间的差距。', scatter: '点越接近同一方向，两个指标相关性越明显。', bubble: '横纵位置代表两个指标，圆面积代表第三个指标。', heatmap: '颜色越深代表数值越高，适合定位高低组合。', radar: '轮廓越外扩代表整体指标越强，凹陷处是短板。', parallel: '线条交叉和聚集能揭示多指标模式。'
    }[type] || '根据图形编码快速发现趋势、差异和异常。';
}
function render() {
    updateMeta();
    if (!state.rows.length) return drawEmpty('暂无数据');
    const type = activeType();
    setupCanvas();
    const numeric = state.fields.filter(f => f.type === 'numeric');
    const categories = state.fields.filter(f => f.type === 'category');
    const dates = state.fields.filter(f => f.type === 'date');
    if (type === 'line') drawLine(dates[0] || categories[0], numeric[0], dates[0] ? categories[0] : null);
    else if (type === 'scatter') drawScatter(numeric[0], numeric[1], categories[0]);
    else if (type === 'bubble') drawBubble(numeric[0], numeric[1], numeric[2], categories[0]);
    else if (type === 'heatmap') drawHeatmap(categories[0], categories[1] || dates[0], numeric[0]);
    else if (type === 'radar') drawRadar(categories[0], numeric.slice(0, 8));
    else if (type === 'parallel') drawParallel(numeric.slice(0, 8), categories[0]);
    else drawBar(categories[0] || dates[0], numeric[0]);
}
function setupCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(900, Math.floor(rect.width * dpr));
    canvas.height = Math.max(540, Math.floor(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fffdfa';
    ctx.fillRect(0, 0, rect.width, rect.height);
}
function frame(title) {
    const w = canvas.clientWidth, h = canvas.clientHeight, pad = 62;
    ctx.fillStyle = '#1f2430'; ctx.font = '700 22px Inter, sans-serif'; ctx.fillText(title, 28, 38);
    ctx.strokeStyle = '#e5dccc'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, h - pad); ctx.lineTo(w - 26, h - pad); ctx.moveTo(pad, 58); ctx.lineTo(pad, h - pad); ctx.stroke();
    return { w, h, pad, plotW: w - pad - 38, plotH: h - pad - 72 };
}
function scale(value, min, max, a, b) { return min === max ? (a + b) / 2 : a + (value - min) * (b - a) / (max - min); }
function extent(field) { const vals = state.rows.map(r => Number(r[field?.name])).filter(Number.isFinite); return [Math.min(...vals), Math.max(...vals)]; }
function color(i, alpha = 1) { return [`rgba(124,92,255,${alpha})`, `rgba(0,167,167,${alpha})`, `rgba(255,159,67,${alpha})`, `rgba(231,76,60,${alpha})`, `rgba(46,134,222,${alpha})`][i % 5]; }
function label(text, x, y, align = 'center') { ctx.fillStyle = '#6d7280'; ctx.font = '12px Inter, sans-serif'; ctx.textAlign = align; ctx.fillText(String(text).slice(0, 16), x, y); ctx.textAlign = 'left'; }
function drawBar(cat, num) {
    if (!cat || !num) return drawEmpty('柱状图需要分类和数值字段');
    const box = frame(`${num.name} 按 ${cat.name} 对比`);
    const grouped = aggregate(cat, num).slice(0, 18);
    const max = Math.max(...grouped.map(d => d.value));
    const bw = box.plotW / grouped.length * .68;
    grouped.forEach((d, i) => {
        const x = box.pad + i * box.plotW / grouped.length + box.plotW / grouped.length * .16;
        const y = scale(d.value, 0, max, box.h - box.pad, 70);
        ctx.fillStyle = color(i, .82); roundRect(x, y, bw, box.h - box.pad - y, 10); ctx.fill();
        label(d.key, x + bw / 2, box.h - 38);
    });
}
function drawLine(xField, num, seriesField) {
    if (!xField || !num) return drawEmpty('折线图需要时间/分类和数值字段');
    const box = frame(seriesField ? `${num.name} 趋势（按 ${seriesField.name} 分组）` : `${num.name} 趋势`);
    const validRows = state.rows.filter(r => Number.isFinite(Number(r[num.name])));
    const xValues = [...new Set(validRows.map(r => r[xField.name]))];
    const groups = seriesField ? [...new Set(validRows.map(r => r[seriesField.name]))].slice(0, 6) : ['全部'];
    const [minY, maxY] = extent(num);
    groups.forEach((group, gi) => {
        const points = validRows.filter(r => !seriesField || r[seriesField.name] === group);
        ctx.strokeStyle = color(gi, .9); ctx.lineWidth = 3; ctx.beginPath();
        points.forEach((r, i) => {
            const x = scale(xValues.indexOf(r[xField.name]), 0, Math.max(1, xValues.length - 1), box.pad, box.w - 36);
            const y = scale(Number(r[num.name]), minY, maxY, box.h - box.pad, 70);
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
        points.forEach(r => { const x = scale(xValues.indexOf(r[xField.name]), 0, Math.max(1, xValues.length - 1), box.pad, box.w - 36); const y = scale(Number(r[num.name]), minY, maxY, box.h - box.pad, 70); ctx.fillStyle = color(gi); ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill(); });
        if (seriesField) { ctx.fillStyle = color(gi); ctx.fillRect(26, 66 + gi * 18, 10, 10); label(group, 42, 76 + gi * 18, 'left'); }
    });
    xValues.forEach((xv, i) => { if (i % Math.ceil(xValues.length / 8) === 0) label(xv, scale(i, 0, Math.max(1, xValues.length - 1), box.pad, box.w - 36), box.h - 38); });
}
function drawScatter(xf, yf, cf) {
    if (!xf || !yf) return drawEmpty('散点图需要两个数值字段');
    const box = frame(`${xf.name} × ${yf.name}`), [minX, maxX] = extent(xf), [minY, maxY] = extent(yf);
    state.rows.forEach((r, i) => { const x = scale(Number(r[xf.name]), minX, maxX, box.pad, box.w - 36); const y = scale(Number(r[yf.name]), minY, maxY, box.h - box.pad, 70); ctx.fillStyle = color(cf ? hash(r[cf.name]) : i, .75); ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill(); });
    label(xf.name, box.w / 2, box.h - 18); label(yf.name, 18, box.h / 2, 'left');
}
function drawBubble(xf, yf, sf, cf) {
    if (!xf || !yf || !sf) return drawEmpty('气泡图需要三个数值字段');
    drawScatter(xf, yf, cf);
    const [minS, maxS] = extent(sf), [minX, maxX] = extent(xf), [minY, maxY] = extent(yf);
    state.rows.forEach((r, i) => { const x = scale(Number(r[xf.name]), minX, maxX, 62, canvas.clientWidth - 36); const y = scale(Number(r[yf.name]), minY, maxY, canvas.clientHeight - 62, 70); const rad = scale(Number(r[sf.name]), minS, maxS, 8, 28); ctx.fillStyle = color(cf ? hash(r[cf.name]) : i, .38); ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.fill(); });
}
function drawHeatmap(rowF, colF, num) {
    if (!rowF || !colF || !num) return drawEmpty('热力图需要两个分类/时间字段和一个数值字段');
    const box = frame(`${num.name} 热力分布`), rows = unique(rowF), cols = unique(colF), data = new Map();
    state.rows.forEach(r => data.set(`${r[rowF.name]}|${r[colF.name]}`, Number(r[num.name])));
    const vals = [...data.values()].filter(Number.isFinite), min = Math.min(...vals), max = Math.max(...vals);
    const cw = box.plotW / cols.length, ch = box.plotH / rows.length;
    rows.forEach((rv, yI) => cols.forEach((cv, xI) => { const val = data.get(`${rv}|${cv}`); const t = Number.isFinite(val) ? scale(val, min, max, .18, 1) : .04; ctx.fillStyle = `rgba(124,92,255,${t})`; ctx.fillRect(box.pad + xI*cw + 1, 70 + yI*ch + 1, cw - 2, ch - 2); }));
    cols.forEach((c, i) => label(c, box.pad + i*cw + cw/2, box.h - 38)); rows.forEach((r, i) => label(r, 20, 75 + i*ch + ch/2, 'left'));
}
function drawRadar(labelField, nums) {
    if (nums.length < 3) return drawEmpty('雷达图至少需要三个数值指标');
    const w = canvas.clientWidth, h = canvas.clientHeight, cx = w/2, cy = h/2 + 20, radius = Math.min(w, h) * .32;
    frame('多指标雷达图');
    for (let ring=1; ring<=4; ring++) { ctx.strokeStyle = '#e5dccc'; ctx.beginPath(); nums.forEach((_, i) => { const a = -Math.PI/2 + i*Math.PI*2/nums.length; const r = radius*ring/4; const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); ctx.stroke(); }
    nums.forEach((n, i) => { const a = -Math.PI/2 + i*Math.PI*2/nums.length; label(n.name, cx + Math.cos(a)*(radius+42), cy + Math.sin(a)*(radius+26)); });
    const ext = nums.map(extent);
    state.rows.slice(0, 5).forEach((row, ri) => { ctx.fillStyle = color(ri, .13); ctx.strokeStyle = color(ri, .82); ctx.beginPath(); nums.forEach((n, i) => { const a = -Math.PI/2 + i*Math.PI*2/nums.length; const r = scale(Number(row[n.name]), ext[i][0], ext[i][1], 0, radius); const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.closePath(); ctx.fill(); ctx.stroke(); label(row[labelField?.name] || `第${ri+1}行`, 30, 76 + ri*20, 'left'); });
}
function drawParallel(nums, labelField) {
    if (nums.length < 3) return drawEmpty('平行坐标至少需要三个数值指标');
    const box = frame('多维平行坐标');
    const ext = nums.map(extent);
    nums.forEach((n, i) => { const x = scale(i, 0, nums.length-1, box.pad, box.w - 42); ctx.strokeStyle = '#d8cfbf'; ctx.beginPath(); ctx.moveTo(x, 72); ctx.lineTo(x, box.h - box.pad); ctx.stroke(); label(n.name, x, 58); });
    state.rows.slice(0, 60).forEach((row, ri) => { ctx.strokeStyle = color(labelField ? hash(row[labelField.name]) : ri, .28); ctx.lineWidth = 1.8; ctx.beginPath(); nums.forEach((n, i) => { const x = scale(i, 0, nums.length-1, box.pad, box.w - 42); const y = scale(Number(row[n.name]), ext[i][0], ext[i][1], box.h - box.pad, 78); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); });
}
function aggregate(cat, num) {
    const map = new Map();
    state.rows.forEach(r => { const key = r[cat.name]; const val = Number(r[num.name]); if (Number.isFinite(val)) map.set(key, (map.get(key) || 0) + val); });
    return [...map.entries()].map(([key, value]) => ({ key, value })).sort((a,b) => b.value - a.value);
}
function unique(field) { return [...new Set(state.rows.map(r => r[field.name]).filter(v => v !== undefined && v !== null))].slice(0, 18); }
function hash(value) { return String(value).split('').reduce((sum, char) => sum + char.charCodeAt(0), 0); }
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawEmpty(message) { setupCanvas(); ctx.fillStyle = '#6d7280'; ctx.font = '700 24px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(message, canvas.clientWidth/2, canvas.clientHeight/2); ctx.textAlign = 'left'; }
window.addEventListener('resize', debounce(render, 180));
update();
</script>
