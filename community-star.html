<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>词元之间 · 社群关系星图</title><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script><style>:root{--paper:#f8f3ea;--ink:#241f1a;--muted:#74685c;--brand:#b84b2c;--line:rgba(69,50,35,.16);--panel:rgba(255,250,242,.86)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(120deg,rgba(248,243,234,.96),rgba(244,224,204,.82)),#f8f3ea;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:minmax(320px,420px) 1fr}aside{display:flex;flex-direction:column;gap:22px;padding:34px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px)}a{color:inherit;text-decoration:none}.back{color:var(--brand);font-weight:800;font-size:14px}h1{margin:20px 0 0;font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(42px,5vw,68px);line-height:.98;font-weight:500;letter-spacing:0}p{color:var(--muted);line-height:1.8}.controls{display:grid;gap:12px;margin-top:6px}button{min-height:44px;border:1px solid var(--line);background:#fffaf2;color:#44372d;font:inherit;font-weight:700;cursor:pointer;transition:.16s}button.active,button:hover{border-color:var(--brand);background:var(--brand);color:#fffaf4}.card{margin-top:auto;padding:20px;border:1px solid var(--line);background:rgba(255,255,255,.46)}.card strong{display:block;margin-bottom:8px}.card span{color:var(--muted);font-size:14px}main{position:relative;min-height:100vh}#chart{position:absolute;inset:0}.legend{position:absolute;right:24px;bottom:24px;display:flex;flex-wrap:wrap;gap:10px;max-width:520px;padding:14px;border:1px solid var(--line);background:rgba(255,250,242,.82);backdrop-filter:blur(12px);color:var(--muted);font-size:13px}.dot{display:inline-flex;align-items:center;gap:7px}.dot:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}@media(max-width:880px){.layout{grid-template-columns:1fr}aside{min-height:auto}main{min-height:68vh}.legend{left:16px;right:16px;bottom:16px}}</style></head><body><div class="layout"><aside><a class="back" href="index.html">返回个人主页</a><div><h1>词元之间 · 关系星图</h1><p>这张图用于展示社群中“人、兴趣与话题”的连接方式。它不是通讯录，而是一张帮助成员找到共同语言、开启合作与讨论的地图。</p></div><div class="controls"><button class="active" data-focus="all">全部关系</button><button data-focus="ai">AI 与前沿科技</button><button data-focus="humanity">人文与表达</button><button data-focus="growth">成长与行动</button></div><div class="card"><strong>破冰方式</strong><span>点击节点查看推荐理由；拖拽节点可以重新整理关系。后续可以把真实成员资料、标签和推荐语接入这里。</span></div></aside><main><div id="chart"></div><div class="legend"><span class="dot" style="--c:#b84b2c">核心社群</span><span class="dot" style="--c:#c4914a">主题兴趣</span><span class="dot" style="--c:#6f7f67">行动项目</span><span class="dot" style="--c:#d7a799">表达与人文</span></div></main></div><script>const chart=echarts.init(document.getElementById('chart')),colors=['#b84b2c','#c4914a','#6f7f67','#d7a799'];const nodes=[['ciyuan','词元之间',0,74,'青年知识社群的共同入口'],['ai','AI 实践',1,52,'工具、模型、自动化与真实工作流'],['frontier','前沿科技',1,46,'从新产品到新产业的持续观察'],['economics','经济学视角',1,44,'理解选择、激励与市场变化'],['humanity','人文关怀',3,50,'让技术议题回到具体的人'],['writing','写作表达',3,42,'把复杂想法讲清楚、讲动人'],['daily','社群日报',2,50,'每日整理共同语境与讨论入口'],['visual','可视化项目',2,44,'把洞察转化为图形与界面'],['game','游戏实验',2,40,'用互动体验表达陪伴与校园想象'],['growth','青年成长',2,42,'把学习、表达和行动连接起来'],['campus','校园连接',2,38,'浙江大学场景中的同伴网络']].map(([id,name,category,symbolSize,value])=>({id,name,category,symbolSize,value}));const links=[['ciyuan','ai',7],['ciyuan','humanity',7],['ciyuan','daily',8],['ciyuan','growth',6],['ai','frontier',8],['ai','visual',6],['frontier','economics',5],['economics','visual',5],['humanity','writing',7],['humanity','game',4],['daily','writing',5],['daily','frontier',6],['growth','campus',6],['campus','game',5],['growth','visual',4]].map(([source,target,value])=>({source,target,value}));const focusMap={all:nodes.map(n=>n.id),ai:['ciyuan','ai','frontier','economics','visual','daily'],humanity:['ciyuan','humanity','writing','game','daily'],growth:['ciyuan','growth','campus','visual','game','daily']};function render(focus='all'){const keep=new Set(focusMap[focus]);chart.setOption({backgroundColor:'transparent',tooltip:{trigger:'item',borderColor:'rgba(69,50,35,.16)',backgroundColor:'rgba(255,250,242,.96)',textStyle:{color:'#241f1a'},formatter:p=>p.dataType==='edge'?'关系强度：'+p.data.value:'<strong>'+p.data.name+'</strong><br/>'+p.data.value},series:[{type:'graph',layout:'force',roam:true,draggable:true,data:nodes.filter(n=>keep.has(n.id)),links:links.filter(l=>keep.has(l.source)&&keep.has(l.target)),categories:['核心社群','主题兴趣','行动项目','表达与人文'].map((name,i)=>({name,itemStyle:{color:colors[i]}})),force:{repulsion:260,edgeLength:[88,180],gravity:.08},lineStyle:{color:'source',opacity:.42,width:1.4,curveness:.08},label:{show:true,position:'right',color:'#3a3028',fontFamily:'PingFang SC, Microsoft YaHei, sans-serif',fontSize:13},emphasis:{focus:'adjacency',lineStyle:{width:3,opacity:.8}}}]})}document.querySelectorAll('button[data-focus]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button[data-focus]').forEach(i=>i.classList.remove('active'));b.classList.add('active');render(b.dataset.focus)}));addEventListener('resize',()=>chart.resize());render();</script></body></html>
